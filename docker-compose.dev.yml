services:
  postgres:
    image: postgres:18-alpine
    container_name: errorium_postgres_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-errorium}
      POSTGRES_USER: ${POSTGRES_USER:-errorium_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-errorium_password}
    volumes:
      - errorium_dev_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-errorium_user} -d ${POSTGRES_DB:-errorium}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - errorium_dev_net

  minio:
    image: minio/minio:latest
    container_name: errorium_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    volumes:
      - errorium_dev_minio_data:/data
    networks:
      - errorium_dev_net

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: errorium_gateway_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    environment:
      - GATEWAY_PORT=8000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-errorium}
      - DB_USER=${POSTGRES_USER:-errorium_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-errorium_password}
      - DB_SSLMODE=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadminpassword}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-errorium-avatars}
      - MINIO_USE_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - errorium_dev_net

  frontend:
    image: nginx:1.26-alpine
    container_name: errorium_frontend_dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./services/frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/frontend/static:/usr/share/nginx/html:ro
    depends_on:
      - gateway
    networks:
      - errorium_dev_net

volumes:
  errorium_dev_postgres_data:
  errorium_dev_minio_data:

networks:
  errorium_dev_net:
    driver: bridge

