# ==============================================================================
# Errorium — Конфигурация Garage Object Storage (/etc/garage.toml)
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/
# ==============================================================================

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1
compression_level = 2
metadata_auto_snapshot_interval = "6h"

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret передается через переменную окружения GARAGE_RPC_SECRET

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
# admin_token передается через переменную окружения GARAGE_ADMIN_TOKEN
