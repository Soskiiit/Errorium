x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    container_name: errorium_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-errorium}
      POSTGRES_USER: ${POSTGRES_USER:-errorium_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - errorium_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-errorium_user} -d ${POSTGRES_DB:-errorium}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - errorium_net

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: errorium_garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    logging: *default-logging
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:-${GARAGE_ACCESS_KEY:-garageadmin}}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:-${GARAGE_SECRET_KEY:?GARAGE_SECRET_KEY is required}}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-${GARAGE_BUCKET_NAME:-errorium-avatars}}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - errorium_garage_meta:/var/lib/garage/meta
      - errorium_garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "node", "id"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - errorium_net

  gateway:
    image: ghcr.io/soskiiit/errorium-gateway:develop
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: errorium_gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-8000}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-errorium}
      - DB_USER=${POSTGRES_USER:-errorium_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_SSLMODE=disable
      - S3_ENDPOINT=garage:3900
      - S3_REGION=garage
      - S3_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY:-${GARAGE_ACCESS_KEY:-garageadmin}}
      - S3_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY:-${GARAGE_SECRET_KEY:?GARAGE_SECRET_KEY is required}}
      - S3_BUCKET_NAME=${GARAGE_DEFAULT_BUCKET:-${GARAGE_BUCKET_NAME:-errorium-avatars}}
      - S3_USE_SSL=false
      - GARAGE_ENDPOINT=garage:3900
      - GARAGE_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY:-${GARAGE_ACCESS_KEY:-garageadmin}}
      - GARAGE_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY:-${GARAGE_SECRET_KEY:?GARAGE_SECRET_KEY is required}}
      - GARAGE_BUCKET_NAME=${GARAGE_DEFAULT_BUCKET:-${GARAGE_BUCKET_NAME:-errorium-avatars}}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - errorium_net

  frontend:
    image: ghcr.io/soskiiit/errorium-frontend:develop
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: errorium_frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - /etc/ssl/errorium.crt:/etc/ssl/errorium.crt:ro
      - /etc/ssl/errorium.key:/etc/ssl/errorium.key:ro
    depends_on:
      - gateway
    networks:
      - errorium_net

volumes:
  errorium_postgres_data:
  errorium_garage_meta:
  errorium_garage_data:

networks:
  errorium_net:
    driver: bridge
