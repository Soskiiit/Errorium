x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    container_name: errorium_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-errorium}
      POSTGRES_USER: ${POSTGRES_USER:-errorium_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - errorium_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-errorium_user} -d ${POSTGRES_DB:-errorium}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - errorium_net

  minio:
    image: minio/minio:latest
    container_name: errorium_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - errorium_minio_data:/data
    networks:
      - errorium_net

  gateway:
    image: ghcr.io/soskiiit/errorium-gateway:develop
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: errorium_gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-8000}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-errorium}
      - DB_USER=${POSTGRES_USER:-errorium_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_SSLMODE=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-errorium-avatars}
      - MINIO_USE_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - errorium_net

  frontend:
    image: ghcr.io/soskiiit/errorium-frontend:develop
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: errorium_frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - /etc/ssl/errorium.crt:/etc/ssl/errorium.crt:ro
      - /etc/ssl/errorium.key:/etc/ssl/errorium.key:ro
    depends_on:
      - gateway
    networks:
      - errorium_net

volumes:
  errorium_postgres_data:
  errorium_minio_data:

networks:
  errorium_net:
    driver: bridge
